; Solar Repeater: Xiao ESP32-C6 + Wio-SX1262 kit module, wired through the
; module's header pads (not the B2B connector). The kit module's pads are
; shifted by one pin compared to upstream's Xiao_C6 target:
;   D0=DIO1, D1=BUSY, D2=RST, D3=NSS, D4=RF_SW, D8/D9/D10=SCK/MISO/MOSI
[env:solar_repeater]
extends = env:Xiao_C6_repeater_
build_flags =
  ${env:Xiao_C6_repeater_.build_flags}
  ${us_preset.build_flags}
  -D P_LORA_DIO_1=0
  -D P_LORA_BUSY=1
  -D P_LORA_RESET=2
  -D P_LORA_NSS=21
  -D SX126X_RXEN=22
  ; battery sense: D0-D2 (the only ADC pins on the header) are taken by the
  ; radio, so the divider goes on the GPIO6 (MTCK) back pad; GPIO4/5 are
  ; strapping pins. Upstream hardcodes a 1:1 divider.
  -D PIN_VBAT_READ=6
  -D ADVERT_NAME='"CHZ Repeater"'
  ; upstream disables WiFi OTA on all C6 boards; tested working on this one
  -UDISABLE_WIFI_OTA
