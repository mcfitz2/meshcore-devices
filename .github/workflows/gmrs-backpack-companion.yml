name: GMRS Backpack Companion

on:
  workflow_dispatch:
    inputs:
      version:
        description: MeshCore version, e.g. v1.17.1 (blank = latest)
        required: false
        default: ""

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/build-device.yml
    with:
      slug: gmrs-backpack-companion
      version: ${{ inputs.version }}

  pages:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
