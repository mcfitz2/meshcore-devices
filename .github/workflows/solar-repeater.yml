name: Solar Repeater

on:
  workflow_dispatch:
    inputs:
      version:
        description: MeshCore version, e.g. v1.17.1 (blank = latest)
        required: false
        default: ""

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/build-device.yml
    with:
      slug: solar-repeater
      version: ${{ inputs.version }}
