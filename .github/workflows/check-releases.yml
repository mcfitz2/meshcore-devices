name: Check for MeshCore releases

# Daily and on pushes that change device config, build any device whose
# release for the latest MeshCore version is missing, incomplete, or built
# from older config (see scripts/plan-builds.sh). Exits in seconds when
# nothing needs building.
on:
  push:
    branches: [main]
    paths:
      - devices.json
      - devices/**
      - scripts/build-device.sh
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            devices.json
            scripts

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          builds=$(scripts/plan-builds.sh)
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.builds) }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-device.yml
    with:
      slug: ${{ matrix.slug }}
      version: ${{ matrix.version }}

  pages:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
