name: Check for MeshCore releases

# Once a day, build any device whose release for the latest MeshCore
# version doesn't exist yet. Exits in seconds when nothing is new.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            devices.json
            scripts

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          builds='[]'
          while read -r slug firmware; do
            tag=$(scripts/latest-tag.sh "$firmware")
            version=${tag##*-}
            if gh release view "$slug-$version" >/dev/null 2>&1; then
              echo "$slug: $version already built"
            else
              echo "$slug: building $version"
              builds=$(jq -c --arg s "$slug" --arg v "$version" '. + [{slug: $s, version: $v}]' <<< "$builds")
            fi
          done < <(jq -r '.[] | "\(.slug) \(.firmware)"' devices.json)
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.builds) }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-device.yml
    with:
      slug: ${{ matrix.slug }}
      version: ${{ matrix.version }}

  pages:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
