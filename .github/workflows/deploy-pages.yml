name: Deploy web flasher

# Publishes the newest release of every device to GitHub Pages. Called after
# builds (releases made by workflows don't trigger other workflows), and runs
# on its own when the site generator or device list changes.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - devices.json
      - scripts/build-site.sh
      - .github/workflows/deploy-pages.yml

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            devices.json
            scripts

      - run: scripts/build-site.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 1

      - id: deploy
        uses: actions/deploy-pages@v5
